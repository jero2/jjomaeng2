name: fetch-images
# images/_fetch.txt 에 "파일명 URL" 줄을 넣고 push하면 images/로 내려받아 커밋한다
on:
  push:
    paths: ["images/_fetch.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            curl -fsSL "$url" -o "images/$name"
            echo "ok $name $(stat -c%s images/$name)"
          done < images/_fetch.txt
          : > images/_fetch.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "이미지 내려받기"
          git push
